<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>rod-connect.com</title>
    <style>
        *{
            padding: none;
            margin: none;
        }
        html{
            height: 100vh;
        }
        body{
            height: 100vh;
            align-content: center;
            justify-items: center;

            background-image: url(images/swampOcean.png);
        }


        #comboContainer{
            width: 50vw;
            height: 50vh;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;

            background-color: teal;
            border-radius: 50px;
            border: solid 10px whitesmoke;
        }
            .leftinputContainer, .rightoutputContainer{
                width: 40%;
                height: 80%;
                display: flex;
                flex-direction: column;
                justify-content: space-evenly;
                align-items: center;
                padding: 20px;


                background-color: gray;
                border-radius: 40px 20px 20px 40px;
                border: solid black 10px;
            }
            .rightoutputContainer{
                border-radius:  20px 40px 40px 20px;
            }


                .leftInputs{
                    width: 60%;
                    height: 30px;
                    padding: 5px;
                    border-radius: 10px;
                    font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
                    font-size: 13pt;
                    font-weight: 800;

                }
            @media (width: 1580px){
                #comboContainer{
                    flex-direction: column;
                }
            }

    </style>
</head>
<body>
    <div id="comboContainer">
        <div class="leftinputContainer">
            <input class="leftInputs" type="text" placeholder="Rod">
            <input class="leftInputs" type="text" placeholder="Reel">
            <input class="leftInputs" type="text" placeholder="Line">
            <input class="leftInputs" type="text" placeholder="Lures">
        </div>
        <div class="rightoutputContainer">

        </div>
    </div>
</body>
</html>
