<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap" rel="stylesheet" />
        <link rel="stylesheet" href="fishingCombo.css" />
        <title>rod-connect.com</title>
        <style></style>
    </head>
    <body>
        <!-- this is the container for all the interactions -->
        <div id="comboContainer">
            <!-- this is the left side where all the inputs/searching goes on -->
            <div id="leftSide">
                <div id="typeContainer">
                    <h1 class="type">
                        Type
                        <button class="typeSelector"></button>
                    </h1>
                </div>

                <div id="inPContainer">
                    <input class="inP rod" type="text" placeholder="Rod" />
                    <button>&plus;</button>
                </div>
            </div>
            <!-- this is where all the filtering will show up -->
            <div class="rightoutputContainer">
                <div class="dropDown Rod"></div>
                <div class="dropDown Reel"></div>
                <div class="dropDown Line"></div>
                <div class="dropDown Lures"></div>
            </div>
        </div>

        <script type="module" src="fishingComb.js"></script>
    </body>
</html>
