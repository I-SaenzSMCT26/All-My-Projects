<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap" rel="stylesheet">
    <title>rod-connect.com</title>
    <style>
        *{
            padding: none;
            margin: none;
        }
        html{
            height: 100vh;
        }
        body{
            height: 100vh;
            align-content: center;
            justify-items: center;
            background-image: linear-gradient(to bottom, rgba(138, 186, 209, 1) 70%, rgba(0,0,0,0)), 
            linear-gradient(to right, rgb(109, 211, 169), rgb(43, 104, 133));
        }


        #comboContainer{
            width: clamp(700px, 50vw, 900px);
            height: 50vh;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;

            border-radius: 50px;
            border: solid 5px whitesmoke;
            background-color: black;
        }
            .leftinputContainer, .rightoutputContainer{
                width: 35%;
                height: 75%;
                display: flex;
                flex-direction: column;
                justify-content: space-evenly;
                align-items: center;
                padding: 20px;


                background-color: #2c2c2c;
                border-radius: 40px 20px 20px 40px;
            }
            .rightoutputContainer{
                border-radius:  20px 40px 40px 20px;
            }

                .menuContainer{
                    display: flex;
                    justify-content: space-evenly;
                    align-items: center;
                }
                    .leftInputs{
                        width: 70%;
                        height: 30px;
                        padding: 6px;
                        border-radius: 10px;
                        font-family: "Ubuntu", sans-serif;
                        font-size: 13pt;
                        font-weight: 500;
                        background-color: gray;
                        color: white;
                        outline: none;
                        border: none;
                    }
                    .leftInputs:hover{
                        cursor: pointer;
                        background-color: rgb(85, 85, 85);
                    }
                        .leftInputs::placeholder{
                            color: rgba(0, 0, 0, 0.8);

                        }
                    button{
                        color: black;
                        font-size: 13pt;
                        font-weight: bold;
                        background-color: gray;
                        align-content: center;
                        text-align: center;
                        height: 35px;
                        width: 30px;
                        border-radius: 5px;
                        border: none;
                    }
                    button:hover{
                        background-color: white;
                        color: blue;
                    }
                    .dropDown{
                        position: absolute;
                        z-index: 2;
                        width: 75px;
                        height: 35px;
                        background-color: white;
                        visibility: hidden;
                    }
            @media (width: 1580px){
                #comboContainer{
                    flex-direction: column;
                }
            }

    </style>
</head>
<body>
    <div id="comboContainer">
        <div class="leftinputContainer">
            <div class="menuContainer">
                <input class="leftInputs" type="text" placeholder="Rod">
                <button>&plus;</button>
            </div>
            <div class="menuContainer">
                <input class="leftInputs" type="text" placeholder="Reel">
                <button>&plus;</button>
            </div>
            <div class="menuContainer">
                <input class="leftInputs" type="text" placeholder="Line">
                <button>&plus;</button>
            </div>
            <div class="menuContainer">
                <input class="leftInputs" type="text" placeholder="Lures">
                <button>&plus;</button>
            </div>
        </div>
        <div class="rightoutputContainer">
            <div class="dropDown Rod">

            </div>
            <div class="dropDown Reel">

            </div>
            <div class="dropDown Line">

            </div>
            <div class="dropDown Lures">

            </div>
        </div>
    </div>
</body>
</html>
